<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>D3cSnow</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0e">
<meta name="color-scheme" content="dark">
<link rel="icon" href="./elixir/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0d0d0e; --line:#242428; --line2:#17171a;
  --ink:#ecebe7; --dim:#8e8c88; --faint:#5b5956;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased}

.sheet{max-width:560px;margin:0 auto;
  padding:14vh 24px calc(80px + env(safe-area-inset-bottom))}

.mark{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.rule{height:1px;background:var(--line);margin:14px 0 0}

.idx{margin:44px 0 0;border-top:1px solid var(--line)}
.idx a{display:grid;grid-template-columns:2.6em 1fr auto;align-items:baseline;
  gap:0 14px;padding:15px 2px;border-bottom:1px solid var(--line);
  text-decoration:none;color:var(--ink)}
.idx a:hover{background:var(--line2)}
.idx .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.idx .t{font-size:15px;letter-spacing:.01em}
.idx .d{grid-column:2;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.55}
.idx .s{color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  align-self:center}
.idx a:hover .s{color:var(--dim)}

.note{margin:40px 0 0;padding-top:18px;border-top:1px solid var(--line);
  color:var(--faint);font-size:12px;line-height:1.8}
.note em{color:var(--dim);font-style:normal}

@media (max-width:480px){
  .sheet{padding:9vh 18px calc(60px + env(safe-area-inset-bottom))}
  .idx a{grid-template-columns:2.2em 1fr;gap:0 10px;padding:14px 2px}
  .idx .s{display:none}
}
</style>
</head>
<body>
<div class="sheet">

  <div class="mark">D3cSnow</div>
  <div class="rule"></div>

  <nav class="idx">
    <a href="./elixir/">
      <span class="n">01</span>
      <span class="t">Elixir</span>
      <span class="s">open</span>
      <span class="d">Spaced-repetition study system. Daily drills, Leitner queue, term roadmap.</span>
    </a>
  </nav>

  <p class="note">
    Elixir stores everything in <em>this browser, on this device</em>. Nothing is uploaded.<br>
    Moving devices: <em>Export</em> a JSON from the Progress tab, then <em>Import</em> it on the new one.
  </p>

</div>
</body>
</html>
